<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Call Queue</title>
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calls">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon-512.png">
<style>
:root {
  --bg: #f5f6f8; --card: #ffffff; --ink: #11141a; --muted: #6b7280; --line: #e5e7eb;
  --accent: #2563eb; --accent-ink: #ffffff; --ok: #16a34a; --bad: #dc2626; --warn: #d97706;
  --bad-soft: #fef2f2; --ok-soft: #f0fdf4; --chip: #eef0f4;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b0d12; --card: #151922; --ink: #f3f4f6; --muted: #9aa3b2; --line: #252b37;
    --accent: #3b82f6; --ok: #22c55e; --bad: #ef4444; --warn: #f59e0b;
    --bad-soft: #2a1416; --ok-soft: #0f2418; --chip: #1f2531;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; min-height: 100dvh; padding-bottom: calc(72px + env(safe-area-inset-bottom)); overscroll-behavior-y: none; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: calc(env(safe-area-inset-top) + 10px) 16px 8px; border-bottom: 1px solid var(--line); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font-size: 24px; margin: 0; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
.badge { background: var(--bad); color: #fff; border-radius: 999px; font-size: 13px; font-weight: 700; min-width: 22px; height: 22px; padding: 0 7px; display: inline-flex; align-items: center; justify-content: center; }
.badge.zero { background: var(--ok); }
.stats { font-size: 13px; color: var(--muted); text-align: right; }
.stats b { color: var(--ink); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 600; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .n { opacity: .65; margin-left: 4px; font-weight: 500; }
main { padding: 8px 16px 24px; }
.group-h { display: flex; justify-content: space-between; align-items: baseline; margin: 18px 2px 8px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.group-h .od { color: var(--bad); text-transform: none; letter-spacing: 0; font-weight: 600; }
ul.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
li.swipe { position: relative; border-radius: 14px; overflow: hidden; background: var(--line); }
.bg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font-weight: 700; color: #fff; }
li.swipe[data-dir="right"] .bg { background: var(--ok); }
li.swipe[data-dir="left"] .bg { background: var(--bad); }
li.swipe[data-dir="right"] .bg .r, li.swipe[data-dir="left"] .bg .l { visibility: hidden; }
.row { position: relative; background: var(--card); padding: 12px 12px 12px 14px; display: flex; align-items: center; gap: 12px; touch-action: pan-y; user-select: none; -webkit-user-select: none; border-left: 4px solid transparent; }
.row.overdue { border-left-color: var(--bad); background: linear-gradient(90deg, var(--bad-soft), var(--card) 60%); }
.row .info { flex: 1; min-width: 0; }
.row .name { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .sub { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tag { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 6px; padding: 1px 6px; margin-right: 6px; background: var(--chip); color: var(--muted); }
.tag.od { background: var(--bad); color: #fff; }
.tag.today { background: var(--ok-soft); color: var(--ok); }
.callbtn { flex: none; width: 44px; height: 44px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; text-decoration: none; font-size: 20px; border: 0; }
.empty { text-align: center; padding: 64px 16px; color: var(--muted); }
.empty .big { font-size: 56px; line-height: 1; margin-bottom: 12px; }
.empty h2 { color: var(--ink); margin: 0 0 6px; font-size: 22px; }
.hint { font-size: 13px; color: var(--muted); text-align: center; margin: 14px 0 0; }
nav.tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 6; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
nav.tabs button { background: none; border: 0; padding: 10px 0 12px; font-size: 12px; font-weight: 600; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative; }
nav.tabs button .ic { font-size: 22px; line-height: 1; }
nav.tabs button.on { color: var(--accent); }
nav.tabs .badge { position: absolute; top: 4px; left: calc(50% + 6px); font-size: 11px; height: 18px; min-width: 18px; padding: 0 5px; }
.seg { display: grid; grid-auto-flow: column; background: var(--chip); border-radius: 10px; padding: 3px; margin-top: 10px; }
.seg button { border: 0; background: none; padding: 7px 0; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.card { background: var(--card); border-radius: 14px; padding: 16px; margin-top: 12px; border: 1px solid var(--line); }
.card h3 { margin: 0 0 6px; font-size: 17px; }
.card p { margin: 0 0 10px; color: var(--muted); font-size: 14px; }
input[type=text], input[type=url], input[type=password], input[type=date], input[type=search], textarea, select { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); font-size: 16px; }
textarea { min-height: 84px; resize: vertical; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 10px; padding: 11px 14px; font-weight: 650; background: var(--chip); color: var(--ink); text-decoration: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ok { background: var(--ok); color: #fff; }
.btn.bad { background: var(--bad); color: #fff; }
.btn.block { width: 100%; }
.btnrow { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.btnrow .btn { flex: 1; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sheet-wrap { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.45); display: none; }
.sheet-wrap.open { display: block; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 92dvh; overflow-y: auto; background: var(--bg); border-radius: 18px 18px 0 0; padding: 10px 16px calc(24px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling: touch; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 10px; }
.sheet h2 { margin: 0; font-size: 22px; }
.kv { font-size: 14px; color: var(--muted); margin: 2px 0; word-break: break-word; }
.kv a { color: var(--accent); }
.sug { border-left: 3px solid var(--accent); background: var(--card); padding: 10px 12px; border-radius: 0 10px 10px 0; margin-top: 8px; font-size: 15px; }
.sug b { display: block; font-size: 13px; color: var(--accent); margin-bottom: 2px; }
.sug.ai { border-left-color: var(--warn); white-space: pre-wrap; }
.sug.ai b { color: var(--warn); }
.log { font-size: 13px; color: var(--muted); margin: 4px 0; }
.label { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 16px 0 6px; }
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 30; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 12px 14px; display: none; align-items: center; justify-content: space-between; gap: 12px; font-size: 15px; }
.toast.show { display: flex; }
.toast button { background: none; border: 0; color: var(--accent); font-weight: 700; }
.search { margin-top: 10px; }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1 id="title">Call Queue <span id="dueBadge" class="badge">0</span></h1>
    <div class="stats" id="stats"></div>
  </div>
  <div id="subhead"></div>
</header>
<main id="main"></main>
<nav class="tabs">
  <button data-tab="queue" class="on"><span class="ic">☎︎</span>Queue<span id="tabBadge" class="badge">0</span></button>
  <button data-tab="leads"><span class="ic">☰</span>Leads</button>
  <button data-tab="setup"><span class="ic">⚙︎</span>Import</button>
</nav>
<div class="sheet-wrap" id="sheetWrap"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastBtn">Undo</button></div>
<script src="/app.js"></script>
</body>
</html>
